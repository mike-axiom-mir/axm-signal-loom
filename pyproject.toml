[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-signal-loom"
version = "0.5.0"
description = "Source-organ creativity machine with weighted replayable signal capture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
authors = [{ name = "Mike - Axiom/Mir" }]
dependencies = []

[project.scripts]
axm-signal-loom = "signal_loom.cli:main"\naxm-signal-machine = "signal_loom.machine_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
